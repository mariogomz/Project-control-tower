<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!--CABEZA-->
<title>POS · Acta del proyecto</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Concepto: el acta como un documento vivo. Una banda azul marino con el reencuadre
   (lo que nos pidieron -> a dónde vamos) y debajo tres tramos, uno por sesión. */
:root {
  --fondo: #f3f5fc; --panel: #ffffff; --panel-2: #f3f5fc; --banda: #00005b; --banda-2: #0a1380;
  --linea: rgba(0, 0, 91, .12); --linea-2: rgba(0, 0, 91, .28);
  --tinta: #00005b; --tinta-2: #3b4088; --tinta-3: #6a70a6; --sobre-banda: #ffffff; --sobre-banda-2: #c5cbf5;
  --acento: #0a34ff; --acento-f: rgba(10, 52, 255, .07);
  --ok: #00a56b; --aviso: #c99400; --critico: #e01b18;
  --ok-f: rgba(0, 165, 107, .12); --aviso-f: rgba(255, 200, 0, .22); --critico-f: rgba(224, 27, 24, .09);
  --dato: #0a34ff; --supuesto: #a66d00; --esperanza: #b8327f;
  --f-texto: "Poppins", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-dato: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --fondo: #020633; --panel: #091158; --panel-2: #0d1767; --banda: #050c46; --banda-2: #0d1a7a;
    --linea: rgba(190, 200, 255, .16); --linea-2: rgba(190, 200, 255, .32);
    --tinta: #f3f5ff; --tinta-2: #bcc3ee; --tinta-3: #8a93cc; --sobre-banda: #ffffff; --sobre-banda-2: #bcc3ee;
    --acento: #8ea4ff; --acento-f: rgba(125, 151, 255, .12);
    --ok: #00dc8e; --aviso: #ffc800; --critico: #ff6a67;
    --ok-f: rgba(0, 220, 142, .14); --aviso-f: rgba(255, 200, 0, .14); --critico-f: rgba(255, 90, 87, .16);
    --dato: #8ea4ff; --supuesto: #ffc800; --esperanza: #ff8ac4;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --fondo: #020633; --panel: #091158; --panel-2: #0d1767; --banda: #050c46; --banda-2: #0d1a7a;
  --linea: rgba(190, 200, 255, .16); --linea-2: rgba(190, 200, 255, .32);
  --tinta: #f3f5ff; --tinta-2: #bcc3ee; --tinta-3: #8a93cc; --sobre-banda: #ffffff; --sobre-banda-2: #bcc3ee;
  --acento: #8ea4ff; --acento-f: rgba(125, 151, 255, .12);
  --ok: #00dc8e; --aviso: #ffc800; --critico: #ff6a67;
  --ok-f: rgba(0, 220, 142, .14); --aviso-f: rgba(255, 200, 0, .14); --critico-f: rgba(255, 90, 87, .16);
  --dato: #8ea4ff; --supuesto: #ffc800; --esperanza: #ff8ac4;
}
*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; background: var(--fondo); color: var(--tinta); font-family: var(--f-texto); font-size: 15px; line-height: 1.55; -webkit-font-smoothing: antialiased; }
.ancho { max-width: 1080px; margin-inline: auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
h1, h2, h3, h4, p, ul, ol { margin: 0; }
ul, ol { padding-left: 1.15em; }
button, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--acento); outline-offset: 2px; }
.eti { font-family: var(--f-dato); font-size: 11px; font-weight: 500; letter-spacing: .08em; text-transform: uppercase; color: var(--tinta-3); }
[hidden] { display: none !important; }

/* ---------- navegación */
.nav { background: var(--banda); color: var(--sobre-banda); }
.nav .ancho { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 20px; padding-block: 12px; }
.nav .marca { font-weight: 600; font-size: 15px; letter-spacing: .01em; }
.nav .marca small { font-weight: 400; color: var(--sobre-banda-2); margin-left: 8px; font-size: 12.5px; }
.pestanas { display: flex; flex-wrap: wrap; gap: 4px; }
.pestanas a { color: var(--sobre-banda-2); text-decoration: none; font-size: 13.5px; font-weight: 500; padding: 7px 14px; border-radius: 999px; }
.pestanas a:hover { color: var(--sobre-banda); background: rgba(255, 255, 255, .08); }
.pestanas a[aria-current="page"] { background: var(--sobre-banda); color: var(--banda); }

/* ---------- banda del acta */
.banda { background: linear-gradient(180deg, var(--banda), var(--banda-2)); color: var(--sobre-banda); }
.banda .ancho { padding-block: 26px 30px; display: grid; gap: 20px; }
.banda .eti { color: var(--sobre-banda-2); }
.banda h1 { font-size: clamp(26px, 4.4vw, 40px); font-weight: 600; line-height: 1.12; letter-spacing: -.015em; text-wrap: balance; }
.giro { display: grid; gap: 12px; grid-template-columns: minmax(0, 1fr); }
@media (min-width: 780px) { .giro { grid-template-columns: minmax(0, 5fr) auto minmax(0, 6fr); align-items: stretch; } }
.giro .lado { border: 1px solid rgba(255, 255, 255, .22); border-radius: 12px; padding: 14px 16px; min-width: 0; }
.giro .lado p { font-size: 15px; line-height: 1.5; margin-top: 6px; }
.giro .pedido p { color: var(--sobre-banda-2); font-style: italic; }
.giro .destino { background: rgba(255, 255, 255, .1); border-color: rgba(255, 255, 255, .4); }
.giro .destino p { font-size: 17px; font-weight: 500; }
.giro .flecha { align-self: center; justify-self: center; font-size: 22px; color: var(--sobre-banda-2); }
@media (max-width: 779px) { .giro .flecha { transform: rotate(90deg); } }
.hechos { display: flex; flex-wrap: wrap; gap: 10px 26px; align-items: center; font-size: 13.5px; color: var(--sobre-banda-2); }
.hechos b { color: var(--sobre-banda); font-weight: 500; }
.sello { display: inline-flex; align-items: center; gap: 8px; font-weight: 600; font-size: 13px; letter-spacing: .06em; text-transform: uppercase; padding: 5px 14px 5px 11px; border-radius: 999px; background: rgba(255, 255, 255, .14); color: var(--sobre-banda); }
.sello i { width: 10px; height: 10px; border-radius: 50%; background: var(--sobre-banda-2); }
.sello.go i { background: #00dc8e; } .sello.espera i { background: #ffc800; border-radius: 0; clip-path: polygon(50% 0, 100% 100%, 0 100%); } .sello.no i { background: #ff6a67; border-radius: 2px; }
.medidor { display: flex; align-items: center; gap: 10px; }
.medidor .barra { width: 120px; height: 6px; border-radius: 3px; background: rgba(255, 255, 255, .2); overflow: hidden; }
.medidor .barra i { display: block; height: 100%; background: var(--sobre-banda); border-radius: 3px; }

/* ---------- capas */
.capas { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; }
.capa { border: 1px solid var(--linea); border-radius: 10px; padding: 10px 12px; background: var(--panel); min-width: 0; }
.capa b { display: block; font-size: 14px; font-weight: 600; }
.capa span { font-size: 12.5px; color: var(--tinta-2); }
.capa.viva { border-color: var(--acento); background: var(--acento-f); }
.capa.luego { border-style: dashed; }
.capa.luego b { color: var(--tinta-2); }

/* ---------- tramos y tarjetas */
main.ancho { padding-block: 22px 260px; display: grid; gap: 30px; }
.tramo { display: grid; gap: 14px; }
.tramo > header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 14px; padding-bottom: 8px; border-bottom: 2px solid var(--tinta); }
.tramo > header h2 { font-size: 20px; font-weight: 600; letter-spacing: -.005em; }
.tramo > header p { color: var(--tinta-2); font-size: 13.5px; }
.rejilla { display: grid; gap: 14px; grid-template-columns: repeat(12, minmax(0, 1fr)); }
.tarjeta { grid-column: span 12; background: var(--panel); border: 1px solid var(--linea); border-radius: 14px; padding: 16px 18px 18px; min-width: 0; scroll-margin-top: 14px; }
@media (min-width: 860px) { .tarjeta.m { grid-column: span 6; } .tarjeta.c { grid-column: span 4; } .tarjeta.g { grid-column: span 8; } }
.tarjeta > header { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 10px; }
.tarjeta h3 { font-size: 16px; font-weight: 600; line-height: 1.3; }
.tarjeta.enfoque { outline: 3px solid var(--acento); outline-offset: 2px; }
.que { flex: none; border: 1px solid var(--linea-2); background: transparent; border-radius: 999px; padding: 3px 11px; font-size: 12px; cursor: pointer; color: var(--tinta-2); white-space: nowrap; }
.que:hover, .que[aria-expanded="true"] { border-color: var(--acento); color: var(--acento); }
.explica { background: var(--acento-f); border-radius: 10px; padding: 12px 14px; margin-bottom: 12px; display: grid; gap: 8px; font-size: 13.5px; }
.explica p b { font-weight: 600; }
.tarjeta p + p, .tarjeta p + ul, .tarjeta ul + p { margin-top: 8px; }
.tarjeta li { margin-top: 4px; }
.sub { font-size: 13px; color: var(--tinta-2); }
.grande { font-size: 18px; font-weight: 500; line-height: 1.45; }
.cita { font-size: 18px; line-height: 1.45; font-style: italic; border-left: 3px solid var(--linea-2); padding-left: 14px; }
.falta { font-size: 12.5px; font-style: normal; font-weight: 500; color: var(--critico); background: var(--critico-f); border-radius: 6px; padding: 1px 8px; white-space: nowrap; }
mark.pc { background: var(--aviso-f); color: inherit; border-radius: 6px; padding: 1px 6px; font-size: .92em; font-style: normal; }
.campo { display: grid; gap: 2px; }
.campos { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); }
.duo { display: grid; gap: 12px; grid-template-columns: minmax(0, 1fr); }
@media (min-width: 700px) { .duo { grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; } }
.duo .caja { background: var(--panel-2); border-radius: 10px; padding: 12px 14px; min-width: 0; }
.duo .flecha { justify-self: center; color: var(--tinta-3); font-size: 20px; }
@media (max-width: 699px) { .duo .flecha { transform: rotate(90deg); } }

/* etiquetas: forma + palabra */
.et { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 500; padding: 1px 9px 1px 7px; border-radius: 999px; border: 1px solid var(--linea-2); white-space: nowrap; vertical-align: middle; }
.et i { width: 8px; height: 8px; flex: none; }
.et.dato { border-color: var(--dato); } .et.dato i { background: var(--dato); border-radius: 50%; }
.et.supuesto { border-color: var(--supuesto); } .et.supuesto i { background: var(--supuesto); clip-path: polygon(50% 0, 100% 100%, 0 100%); }
.et.esperanza { border-color: var(--esperanza); border-style: dashed; } .et.esperanza i { border: 1.5px solid var(--esperanza); border-radius: 50%; }
.et.otra i { border: 1.5px solid var(--tinta-3); }
.luz { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; white-space: nowrap; }
.luz i { width: 10px; height: 10px; border-radius: 50%; background: var(--tinta-3); flex: none; }
.luz.verde i { background: var(--ok); } .luz.amarillo i { background: var(--aviso); border-radius: 0; clip-path: polygon(50% 0, 100% 100%, 0 100%); } .luz.rojo i { background: var(--critico); border-radius: 2px; }

/* evidencia */
.reparto { display: flex; height: 10px; gap: 2px; border-radius: 5px; overflow: hidden; margin: 4px 0 10px; }
.reparto i { display: block; min-width: 4px; }
.filtros { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
.filtros button { border: 1px solid var(--linea-2); background: transparent; border-radius: 999px; padding: 3px 12px; font-size: 12.5px; cursor: pointer; }
.filtros button[aria-pressed="true"] { background: var(--tinta); color: var(--panel); border-color: var(--tinta); }
.filas { display: grid; }
.fila { padding: 10px 0; border-top: 1px solid var(--linea); display: grid; gap: 3px; }
.fila:first-child { border-top: 0; padding-top: 2px; }
.fila .pie { font-size: 12.5px; color: var(--tinta-2); display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; }

/* opciones */
.opciones { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); }
.opcion { border: 1px solid var(--linea); border-radius: 12px; padding: 12px 14px; display: grid; gap: 8px; align-content: start; background: var(--panel-2); min-width: 0; }
.opcion.rec { border-color: var(--ok); background: var(--ok-f); }
.opcion.pedida { border-style: dashed; }
.opcion h4 { font-size: 14.5px; font-weight: 600; display: flex; flex-wrap: wrap; gap: 6px 8px; align-items: center; }
.marca-op { font-size: 11px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; padding: 1px 8px; border-radius: 999px; background: var(--tinta); color: var(--panel); }
.marca-op.rec { background: var(--ok); color: #fff; } .marca-op.corta { background: transparent; border: 1px solid var(--linea-2); color: var(--tinta-2); }
.opcion p { font-size: 13.5px; }
.opcion dl { margin: 0; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 3px 10px; font-size: 12.5px; }
.opcion dt { color: var(--tinta-2); } .opcion dd { margin: 0; }
.lineas { display: grid; }
.linea-v { display: grid; grid-template-columns: minmax(0, 1fr); gap: 2px; padding: 9px 0; border-top: 1px solid var(--linea); }
.linea-v:first-child { border-top: 0; }
.linea-v .r { font-weight: 600; }
@media (min-width: 620px) { .linea-v { grid-template-columns: minmax(0, 4fr) minmax(0, 5fr) minmax(0, 4fr) auto; gap: 12px; align-items: baseline; } }
.tres { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); }
.tres h4 { font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; margin-bottom: 4px; display: flex; gap: 7px; align-items: center; }
.punto { width: 9px; height: 9px; border-radius: 50%; background: var(--tinta-3); flex: none; }
.punto.ok { background: var(--ok); } .punto.aviso { background: var(--aviso); border-radius: 0; clip-path: polygon(50% 0, 100% 100%, 0 100%); } .punto.critico { background: var(--critico); border-radius: 2px; }
.clave { border: 2px solid var(--tinta); border-radius: 12px; padding: 14px 16px; display: grid; gap: 10px; }
.indicador { display: grid; gap: 4px; padding: 10px 0; border-top: 1px solid var(--linea); }
.indicador:first-of-type { border-top: 0; padding-top: 2px; }
.indicador .tramo-i { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; font-size: 14px; }
.indicador .tramo-i b { font-size: 20px; font-weight: 600; }
.decision { display: grid; gap: 10px; }
.decision .sello { background: var(--panel-2); color: var(--tinta); font-size: 15px; padding: 7px 18px 7px 13px; justify-self: start; }

/* ---------- cómo funciona */
.intro { display: grid; gap: 14px; max-width: 72ch; }
.intro h1 { font-size: clamp(26px, 4.4vw, 38px); font-weight: 600; line-height: 1.15; letter-spacing: -.015em; text-wrap: balance; }
.intro p { font-size: 16px; color: var(--tinta-2); }
.pasos { counter-reset: paso; display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); list-style: none; padding: 0; }
.pasos li { counter-increment: paso; background: var(--panel); border: 1px solid var(--linea); border-radius: 12px; padding: 14px 16px; display: grid; gap: 4px; align-content: start; }
.pasos li::before { content: counter(paso); font-family: var(--f-dato); font-size: 12px; width: 24px; height: 24px; border-radius: 50%; background: var(--tinta); color: var(--panel); display: grid; place-items: center; }
.pasos b { font-weight: 600; } .pasos span { font-size: 13.5px; color: var(--tinta-2); }
.botones { display: flex; flex-wrap: wrap; gap: 10px; }
.btn { border: 1px solid var(--linea-2); background: var(--panel); border-radius: 10px; padding: 9px 16px; font-size: 14px; font-weight: 500; cursor: pointer; text-decoration: none; color: var(--tinta); display: inline-flex; align-items: center; gap: 8px; }
.btn:hover { border-color: var(--acento); }
.btn.primario { background: var(--acento); border-color: var(--acento); color: #fff; }
:root[data-theme="dark"] .btn.primario { color: #020633; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .btn.primario { color: #020633; } }
.usos { display: grid; }
.uso { display: grid; gap: 4px 16px; padding: 12px 0; border-top: 1px solid var(--linea); grid-template-columns: minmax(0, 1fr); }
.uso:first-child { border-top: 0; }
@media (min-width: 700px) { .uso { grid-template-columns: minmax(0, 3fr) minmax(0, 4fr) minmax(0, 4fr); } }
.uso b { font-weight: 600; } .uso span { font-size: 13.5px; color: var(--tinta-2); }
.uso .eti { display: block; }
.caso30 { background: var(--panel); border: 1px solid var(--linea); border-left: 4px solid var(--acento); border-radius: 12px; padding: 14px 18px; display: grid; gap: 6px; }
.caso30 p { max-width: 78ch; }

/* ---------- mi equipo */
.pegar { display: grid; gap: 14px; max-width: 760px; }
.pegar textarea { width: 100%; min-height: 190px; border: 1px solid var(--linea-2); border-radius: 12px; padding: 12px 14px; background: var(--panel); font-family: var(--f-dato); font-size: 12.5px; line-height: 1.5; resize: vertical; }
.error { color: var(--critico); background: var(--critico-f); border-radius: 10px; padding: 10px 14px; font-size: 14px; }
.barra-equipo { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; justify-content: space-between; font-size: 13.5px; color: var(--tinta-2); }

/* ---------- recorrido */
.guia { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--banda); color: var(--sobre-banda); box-shadow: 0 -10px 30px rgba(0, 0, 40, .25);
  padding-bottom: env(safe-area-inset-bottom, 0px); }
.guia .ancho { padding-block: 14px; display: grid; gap: 8px; }
.guia .cab { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.guia .eti { color: var(--sobre-banda-2); }
.guia h4 { font-size: 16px; font-weight: 600; }
.guia p { font-size: 14px; color: var(--sobre-banda-2); max-width: 88ch; }
.guia p b { color: var(--sobre-banda); font-weight: 500; }
.guia .botones button { border: 1px solid rgba(255, 255, 255, .35); background: transparent; color: var(--sobre-banda); border-radius: 10px; padding: 7px 16px; font-size: 14px; cursor: pointer; }
.guia .botones button.sig { background: var(--sobre-banda); color: var(--banda); border-color: var(--sobre-banda); font-weight: 600; }
.guia .botones button:disabled { opacity: .4; cursor: default; }
.pie { color: var(--tinta-3); font-size: 12.5px; }
@media (prefers-reduced-motion: no-preference) { html { scroll-behavior: smooth; } }
</style>
<!--/CABEZA-->
</head>
<body>
<!--CUERPO-->
<nav class="nav"><div class="ancho">
  <div class="marca">POS<small>Project Operating System</small></div>
  <div class="pestanas" id="pestanas">
    <a href="#como-funciona" data-vista="como-funciona">Cómo funciona</a>
    <a href="#ejemplo" data-vista="ejemplo">Ejemplo</a>
    <a href="#mi-equipo" data-vista="mi-equipo">Mi equipo</a>
  </div>
</div></nav>
<div id="vista"></div>
<div class="guia" id="guia" hidden><div class="ancho">
  <div class="cab"><span class="eti" id="guia-paso"></span><button type="button" id="guia-cerrar" style="background:none;border:0;color:inherit;cursor:pointer;font-size:13px;text-decoration:underline">Salir del recorrido</button></div>
  <h4 id="guia-titulo"></h4>
  <p id="guia-texto"></p>
  <div class="botones"><button type="button" id="guia-ant">Anterior</button><button type="button" class="sig" id="guia-sig">Siguiente</button></div>
</div></div>

<script>
"use strict";

const $ = (s, r = document) => r.querySelector(s);
const h = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const vacio = x => x == null || String(x).trim() === "";
const FALTA = '<span class="falta">falta definir</span>';
/* Texto del equipo: lo vacío se marca, y los [POR CONFIRMAR: …] se resaltan. */
const t = x => vacio(x) ? FALTA : h(x).replace(/\[POR CONFIRMAR:?\s*([^\]]*)\]/gi, (_, q) => `<mark class="pc">por confirmar${q ? ": " + q : ""}</mark>`);
const lista = a => (a && a.length) ? `<ul>${a.map(x => `<li>${t(x)}</li>`).join("")}</ul>` : `<p>${FALTA}</p>`;
const cita = x => vacio(x) ? FALTA : "«" + t(String(x).trim().replace(/^[«"“”']+|[»"“”']+$/g, "")) + "»";
const campo = (rot, v) => `<div class="campo"><span class="eti">${rot}</span><div>${t(v)}</div></div>`;
const sinAcentos = s => String(s ?? "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").trim();
function etiqueta(e) {
  const k = sinAcentos(e), c = ["dato", "supuesto", "esperanza"].includes(k) ? k : "otra";
  return vacio(e) ? "" : `<span class="et ${c}"><i></i>${h(k === "incognita" ? "incógnita" : e)}</span>`;
}
function luz(c) {
  const k = sinAcentos(c), cl = k.startsWith("verde") ? "verde" : k.startsWith("amar") ? "amarillo" : k.startsWith("roj") ? "rojo" : "";
  return vacio(c) ? '<span class="luz"><i></i>no aplica</span>' : `<span class="luz ${cl}"><i></i>${h(c)}</span>`;
}

/* ------------------------------------------------------------ leer el bloque */
const ARR = ["angulos", "encuadres", "evidencia", "preguntas_abiertas", "ideas_estacionadas", "objetivos", "obligatorio", "opciones", "supuestos", "premortem", "huecos"];
const OBJ = ["solicitud", "afectados", "proyecto", "supuesto_clave", "exito", "interesados", "acta", "permisos", "decision"];
const arr = x => Array.isArray(x) ? x : vacio(x) ? [] : [x];
function normalizar(d) {
  const n = { ...d };
  ARR.forEach(k => n[k] = arr(n[k]));
  OBJ.forEach(k => n[k] = (n[k] && typeof n[k] === "object" && !Array.isArray(n[k])) ? { ...n[k] } : {});
  n.proyecto.valor = arr(n.proyecto.valor); n.proyecto.costo = arr(n.proyecto.costo);
  n.exito.indicadores = arr(n.exito.indicadores); n.exito.duenos = (n.exito.duenos && typeof n.exito.duenos === "object") ? n.exito.duenos : {};
  ["dentro", "fuera", "restricciones", "vetos"].forEach(k => n.acta[k] = arr(n.acta[k]));
  ["puede", "pregunta", "nunca"].forEach(k => n.permisos[k] = arr(n.permisos[k]));
  return n;
}
function leerBloque(texto) {
  if (vacio(texto)) return { error: "Pega aquí el bloque POS que te entregó la skill." };
  const i = texto.indexOf("{"), f = texto.lastIndexOf("}");
  if (i < 0 || f <= i) return { error: "No encontré el bloque. Tiene que empezar con { y terminar con }. Cópialo completo desde el chat." };
  const crudo = texto.slice(i, f + 1);
  let d;
  for (const intento of [crudo, crudo.replace(/[“”]/g, '"'), crudo.replace(/[“”]/g, '"').replace(/,\s*([}\]])/g, "$1")]) {
    try { d = JSON.parse(intento); break; } catch (_) { /* probar el siguiente */ }
  }
  if (!d) return { error: "El bloque está incompleto o se alteró al copiarlo. Pídele a la skill: «vuelve a darme el bloque POS completo» y pégalo de nuevo." };
  if (typeof d !== "object" || Array.isArray(d) || !["solicitud", "a", "b", "exito", "acta", "decision"].some(k => k in d))
    return { error: "Esto no parece un bloque POS. Pídele a la skill el bloque POS de tu Framing Brief." };
  return { datos: normalizar(d) };
}

/* ------------------------------------------------------------ qué tan completa está */
/* Cada parte devuelve los textos que la componen. Está lista si ninguno está vacío ni por confirmar. */
const cada = (a, ...claves) => a.length ? a.flatMap(x => claves.map(k => x[k])) : [""];
const CAMPOS = [

  ["Valor y costo con fuente", d => [...cada(d.proyecto.valor, "rango", "fuente"), ...cada(d.proyecto.costo, "rango", "fuente")]], ["Un efecto negativo", d => [d.proyecto.efecto_negativo]],
  ["El supuesto que cambia la decisión", d => [d.supuesto_clave.supuesto]], ["La prueba de ese supuesto, con fecha y dueño", d => [d.supuesto_clave.prueba, d.supuesto_clave.fecha, d.supuesto_clave.dueno]],
  ["El beneficio", d => [d.exito.beneficio]], ["Indicador con fuente, línea base y meta", d => cada(d.exito.indicadores, "indicador", "fuente", "linea_base", "meta")],
  ["El examen intermedio", d => [d.exito.examen_intermedio]], ["Lo que no debe empeorar", d => [d.exito.guardrail]],
  ["Los tres dueños del éxito", d => [d.exito.duenos.beneficio, d.exito.duenos.medicion, d.exito.duenos.desviaciones]],
  ["El pre-mortem", d => d.premortem.length ? d.premortem : [""]], ["Quién gana, quién pierde y quién se ve afectado", d => [d.interesados.ganan, d.interesados.pierden, d.interesados.afectados]],
  ["Lo que queda dentro y al menos tres cosas fuera", d => d.acta.dentro.length && d.acta.fuera.length >= 3 ? [...d.acta.dentro, ...d.acta.fuera] : [""]],
  ["Quién decide", d => [d.acta.decide]], ["Qué puede hacer la IA", d => ["puede", "pregunta", "nunca"].every(k => d.permisos[k].length) ? ["ok"] : [""]],
  ["La decisión: qué autoriza, quién sigue y cuándo se revisa", d => [d.decision.resultado, d.decision.autoriza, d.decision.dueno_siguiente_paso, d.decision.siguiente_revision]],
];
const PC = /\[POR CONFIRMAR/i;
function avance(d) {
  const faltan = CAMPOS.filter(([, f]) => f(d).some(v => vacio(v) || PC.test(String(v)))).map(c => c[0]);
  const pc = (JSON.stringify(d).match(/\[POR CONFIRMAR/gi) || []).length;
  return { total: CAMPOS.length, listos: CAMPOS.length - faltan.length, faltan, pc };
}

function sello(r) {
  const k = sinAcentos(r);
  if (k === "go") return { c: "go", t: "Go" };
  if (k.startsWith("no")) return { c: "no", t: "No-go" };
  if (k.startsWith("invest")) return { c: "espera", t: "Investigar" };
  if (k.startsWith("todav")) return { c: "espera", t: "Todavía no" };
  return { c: "", t: "Sin decisión" };
}
let filtroEv = "";
function evidencia(d) {
  if (!d.evidencia.length) return `<p>${FALTA}</p>`;
  const tipos = ["dato", "supuesto", "esperanza"], n = k => d.evidencia.filter(e => sinAcentos(e.etiqueta) === k).length;
  const reparto = tipos.map(k => n(k) ? `<i style="flex:${n(k)};background:var(--${k})" title="${n(k)} ${k}"></i>` : "").join("");
  const botones = [["", `Todo · ${d.evidencia.length}`], ...tipos.map(k => [k, `${k[0].toUpperCase() + k.slice(1)}s · ${n(k)}`])]
    .map(([k, txt]) => `<button type="button" data-filtro="${k}" aria-pressed="${filtroEv === k}">${txt}</button>`).join("");
  const filas = d.evidencia.filter(e => !filtroEv || sinAcentos(e.etiqueta) === filtroEv).map(e => `<div class="fila"><div>${t(e.afirmacion)}</div>
    <div class="pie">${etiqueta(e.etiqueta)}<span>Fuente: ${t(e.fuente)}</span>${vacio(e.fecha) ? "<span>sin fecha</span>" : `<span>${t(e.fecha)}</span>`}</div></div>`).join("");
  return `<div class="reparto" aria-hidden="true">${reparto}</div><div class="filtros">${botones}</div><div class="filas">${filas || '<p class="sub">Nada con esa etiqueta.</p>'}</div>`;
}
function opciones(d) {
  if (!d.opciones.length) return `<p>${FALTA}</p>`;
  return `<div class="opciones">${d.opciones.map((o, i) => `<article class="opcion ${o.recomendada ? "rec" : ""} ${o.es_la_solicitud ? "pedida" : ""}">
    <h4>${i + 1}. ${t(o.casilla)}${o.recomendada ? '<span class="marca-op rec">Recomendada</span>' : o.en_lista_corta ? '<span class="marca-op corta">Lista corta</span>' : ""}${o.es_la_solicitud ? '<span class="marca-op">Lo que pidieron</span>' : ""}</h4>
    <p>${t(o.descripcion)}</p>
    <dl><dt>Lo obligatorio</dt><dd>${t(o.obligatorio)}</dd><dt>Ajuste estratégico</dt><dd>${luz(o.ajuste)}</dd><dt>Valor por el dinero</dt><dd>${luz(o.valor)}</dd><dt>Se puede lograr</dt><dd>${luz(o.lograr)}</dd><dt>Es</dt><dd>${t(o.tipo)}</dd></dl>
  </article>`).join("")}</div>`;
}
function proyecto(d) {
  const p = d.proyecto, lin = a => a.map(l => `<div class="linea-v"><span>${t(l.linea)}</span><span class="r">${t(l.rango)}</span><span class="sub">${t(l.fuente)}</span><span>${etiqueta(l.tipo)}</span></div>`).join("");
  return `<p class="grande">${t(p.nombre)}</p><p>${t(p.descripcion)}</p>
    <p class="eti" style="margin-top:14px">Valor</p><div class="lineas">${p.valor.length ? lin(p.valor) : `<p>${FALTA}</p>`}</div>
    <p class="eti" style="margin-top:14px">Costo</p><div class="lineas">${p.costo.length ? lin(p.costo) : `<p>${FALTA}</p>`}</div>
    <div class="campos" style="margin-top:14px">${campo("Quién recibe el beneficio", p.beneficiario)}${campo("Efecto negativo", p.efecto_negativo)}</div>`;
}
function supuestos(d) {
  const s = d.supuesto_clave;
  return `<div class="clave"><span class="eti">El supuesto que cambia la decisión</span><p class="grande">${t(s.supuesto)}</p>
    <div class="campos">${campo("Si resulta falso", s.si_es_falso)}${campo("La prueba más barata", s.prueba)}${campo("Fecha", s.fecha)}${campo("Dueño", s.dueno)}</div></div>

function exito(d) {

  return `<header class="banda"><div class="ancho">

      <div class="hechos"><span class="sello ${s.c}"><i></i>${h(s.t)}</span>${vacio(d.acta.decide) ? "" : `<span>Decide: <b>${h(d.acta.decide)}</b></span>`}${vacio(d.decision.limite) ? "" : `<span>Límite: <b>${h(d.decision.limite)}</b></span>`}
        <span class="medidor"><span class="barra"><i style="width:${Math.round(100 * a.listos / a.total)}%"></i></span><span><b>${a.listos} de ${a.total}</b> partes listas${a.pc ? ` · <b>${a.pc}</b> por confirmar` : ""}</span></span></div>

      <p class="pie">Esta página solo muestra lo que el equipo escribió en su Framing Brief. No inventa ni completa nada: lo que falta se ve como «falta definir».</p>

  if (vista === "ejemplo") actual = normalizar(EJEMPLO);
  else if (vista === "mi-equipo") { const r = bloqueEquipo ? leerBloque(bloqueEquipo) : {}; actual = r.datos || null; }
  else actual = null;
  $("#vista").innerHTML = vista === "ejemplo" ? acta(actual, caso30()) : vista === "mi-equipo" ? miEquipo() : comoFunciona();
  if (guia >= 0 && vista !== "ejemplo") cerrarGuia(); else if (guia >= 0) pasoGuia(guia, false);
}
function ir(v) { const antes = vista; vista = ["ejemplo", "mi-equipo"].includes(v) ? v : "como-funciona"; pintar(); if (antes !== vista) scrollTo(0, 0); }
addEventListener("hashchange", () => ir(location.hash.slice(1)));

/* ------------------------------------------------------------ recorrido guiado */
function pasoGuia(n, mover = true) {
  guia = Math.max(0, Math.min(T.length - 1, n)); const c = T[guia];
  document.querySelectorAll(".tarjeta.enfoque").forEach(e => e.classList.remove("enfoque"));
  const el = $("#t-" + c.id); if (el) { el.classList.add("enfoque"); if (mover) el.scrollIntoView({ block: "start" }); }
  $("#guia").hidden = false;
  $("#guia-paso").textContent = `Paso ${guia + 1} de ${T.length} · ${c.origen}`;
  $("#guia-titulo").textContent = c.titulo;
  $("#guia-texto").innerHTML = `${c.que} <b>${c.porque}</b> Después: ${c.despues}`;
  $("#guia-ant").disabled = guia === 0; $("#guia-sig").textContent = guia === T.length - 1 ? "Terminar" : "Siguiente";
}
function cerrarGuia() { guia = -1; $("#guia").hidden = true; document.querySelectorAll(".tarjeta.enfoque").forEach(e => e.classList.remove("enfoque")); }
$("#guia-ant").addEventListener("click", () => pasoGuia(guia - 1));
$("#guia-sig").addEventListener("click", () => guia === T.length - 1 ? cerrarGuia() : pasoGuia(guia + 1));
$("#guia-cerrar").addEventListener("click", cerrarGuia);

document.addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.dataset.que) { const p = $("#e-" + b.dataset.que), abrir = p.hidden; p.hidden = !abrir; b.setAttribute("aria-expanded", abrir); b.textContent = abrir ? "Cerrar" : "¿Qué es esto?"; }
  else if (b.dataset.filtro != null) { filtroEv = b.dataset.filtro; $("#c-evidencia").innerHTML = evidencia(actual); }
  else if (b.id === "ir-guia") { if (vista !== "ejemplo") { vista = "ejemplo"; try { history.replaceState(null, "", "#ejemplo"); } catch (_) { location.hash = "ejemplo"; } pintar(); } pasoGuia(0); }
  else if (b.id === "mostrar") { const txt = $("#bloque").value, r = leerBloque(txt); bloqueEquipo = txt; errorEquipo = r.error || ""; if (r.datos) guardado.poner(txt); pintar(); if (r.datos) scrollTo(0, 0); }
  else if (b.id === "cambiar") { actual = null; errorEquipo = ""; $("#vista").innerHTML = miEquipo(); scrollTo(0, 0); }
  else if (b.id === "borrar") { bloqueEquipo = ""; errorEquipo = ""; guardado.poner(""); pintar(); }
});
ir(location.hash.slice(1));
</script>
