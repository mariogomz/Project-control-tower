<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!--CABEZA-->
<title>POS · Acta de constitución</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Concepto: sala de control. Una pantalla de ruta (siempre oscura, como un instrumento) y, alrededor,
   módulos compactos del acta. Colores de cabina: magenta = lo planeado, cian = la meta, verde/ámbar/rojo = estado. */
:root {
  --fondo: #f3f2ee; --panel: #ffffff; --panel-2: #f0efea; --linea: rgba(22, 24, 29, .10); --linea-2: rgba(22, 24, 29, .24);
  --tinta: #16181d; --tinta-2: #4b505b; --tinta-3: #7c818c;
  --acento: #0e6a72; --acento-f: rgba(14, 106, 114, .08); --plan: #b0257d; --violeta: #6a4fcf;
  --ok: #14805a; --aviso: #b47800; --critico: #c8372d;
  --ok-f: rgba(20, 128, 90, .11); --aviso-f: rgba(214, 150, 0, .16); --critico-f: rgba(200, 55, 45, .09);
  --p-fondo: #0c0f14; --p-fondo-2: #141922; --p-linea: #2b323e; --p-tinta: #eef0f4; --p-tinta-2: #a4acba; --p-tinta-3: #717a8a;
  --p-plan: #e868bb; --p-meta: #63d2da; --p-ok: #3ddc97; --p-aviso: #f5b83d; --p-critico: #f26d68;
  --f-texto: "Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-dato: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --radio: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --fondo: #0f1115; --panel: #171a20; --panel-2: #1e222a; --linea: rgba(255, 255, 255, .09); --linea-2: rgba(255, 255, 255, .22);
    --tinta: #eceef2; --tinta-2: #aab0bc; --tinta-3: #7b8291;
    --acento: #63d2da; --acento-f: rgba(99, 210, 218, .10); --plan: #e868bb; --violeta: #a996f0;
    --ok: #3ddc97; --aviso: #f5b83d; --critico: #f26d68;
    --ok-f: rgba(61, 220, 151, .12); --aviso-f: rgba(245, 184, 61, .13); --critico-f: rgba(242, 109, 104, .13);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --fondo: #0f1115; --panel: #171a20; --panel-2: #1e222a; --linea: rgba(255, 255, 255, .09); --linea-2: rgba(255, 255, 255, .22);
  --tinta: #eceef2; --tinta-2: #aab0bc; --tinta-3: #7b8291;
  --acento: #63d2da; --acento-f: rgba(99, 210, 218, .10); --plan: #e868bb; --violeta: #a996f0;
  --ok: #3ddc97; --aviso: #f5b83d; --critico: #f26d68;
  --ok-f: rgba(61, 220, 151, .12); --aviso-f: rgba(245, 184, 61, .13); --critico-f: rgba(242, 109, 104, .13);
}
*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; background: var(--fondo); color: var(--tinta); font-family: var(--f-texto); font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
.ancho { max-width: 1240px; margin-inline: auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
h1, h2, h3, h4, p, ul, ol, dl, dd { margin: 0; }
ul, ol { padding-left: 1.1em; }
button, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--acento); outline-offset: 2px; }
[hidden] { display: none !important; }
.eti { font-family: var(--f-dato); font-size: 10.5px; font-weight: 500; letter-spacing: .09em; text-transform: uppercase; color: var(--tinta-3); }
.ico { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.sub { font-size: 13px; color: var(--tinta-2); }
.corta { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; }
.corta.c3 { -webkit-line-clamp: 3; }
.falta { font-size: 12px; font-weight: 500; color: var(--critico); background: var(--critico-f); border-radius: 6px; padding: 1px 7px; white-space: nowrap; }
mark.pc { background: var(--aviso-f); color: inherit; border-radius: 6px; padding: 1px 6px; font-size: .92em; }

/* ---------- barra superior */
.nav { border-bottom: 1px solid var(--linea); background: var(--panel); }
.nav .ancho { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 20px; padding-block: 10px; }
.marca { display: flex; align-items: center; gap: 10px; font-weight: 600; letter-spacing: .01em; }
.marca i { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--tinta); position: relative; }
.marca i::after { content: ""; position: absolute; left: 50%; top: 50%; width: 9px; height: 2px; background: var(--plan); transform-origin: 0 50%; transform: rotate(-40deg); }
.marca small { font-weight: 400; color: var(--tinta-3); font-size: 12.5px; }
.pestanas { display: flex; gap: 2px; background: var(--panel-2); border-radius: 999px; padding: 3px; }
.pestanas a { color: var(--tinta-2); text-decoration: none; font-size: 13.5px; font-weight: 500; padding: 6px 14px; border-radius: 999px; }
.pestanas a:hover { color: var(--tinta); }
.pestanas a[aria-current="page"] { background: var(--tinta); color: var(--panel); }

/* ---------- encabezado del proyecto */
.cab { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px 24px; padding-block: 22px 16px; }
.cab h1 { font-size: clamp(26px, 3.6vw, 36px); font-weight: 600; letter-spacing: -.02em; line-height: 1.1; text-wrap: balance; }
.cab .hechos { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { display: inline-flex; align-items: center; gap: 7px; font-size: 12.5px; padding: 4px 11px; border-radius: 999px; border: 1px solid var(--linea-2); color: var(--tinta-2); background: var(--panel); white-space: nowrap; }
.chip b { color: var(--tinta); font-weight: 600; }

/* ---------- estado: forma + palabra */
.est { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; white-space: nowrap; }
.est i { width: 9px; height: 9px; flex: none; background: var(--tinta-3); border-radius: 50%; }
.est.ok i { background: var(--ok); } .est.aviso i { background: var(--aviso); border-radius: 0; clip-path: polygon(50% 0, 100% 100%, 0 100%); } .est.critico i { background: var(--critico); border-radius: 2px; }
.est.hueco i { background: transparent; border: 1.5px solid var(--tinta-3); }
.et { display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; font-weight: 500; padding: 1px 9px 1px 7px; border-radius: 999px; border: 1px solid var(--linea-2); white-space: nowrap; vertical-align: middle; }
.et i { width: 8px; height: 8px; flex: none; }
.et.dato { border-color: var(--acento); } .et.dato i { background: var(--acento); border-radius: 50%; }
.et.supuesto { border-color: var(--aviso); } .et.supuesto i { background: var(--aviso); clip-path: polygon(50% 0, 100% 100%, 0 100%); }
.et.esperanza { border-color: var(--violeta); border-style: dashed; } .et.esperanza i { border: 1.5px solid var(--violeta); border-radius: 50%; }
.luz { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; white-space: nowrap; }
.luz i { width: 10px; height: 10px; border-radius: 50%; background: var(--tinta-3); flex: none; }
.luz.verde i { background: var(--ok); } .luz.amarillo i { background: var(--aviso); border-radius: 0; clip-path: polygon(50% 0, 100% 100%, 0 100%); } .luz.rojo i { background: var(--critico); border-radius: 2px; }

/* ---------- fila principal: pantalla + consola */
.principal { display: grid; gap: 14px; grid-template-columns: minmax(0, 1fr); }
@media (min-width: 1000px) { .principal { grid-template-columns: minmax(0, 1fr) 340px; } }
.pantalla { position: relative; background: linear-gradient(180deg, var(--p-fondo-2), var(--p-fondo)); border-radius: var(--radio); overflow: hidden; color: var(--p-tinta); border: 1px solid var(--p-linea); min-width: 0; display: flex; flex-direction: column; }
.pantalla.enfoque { outline: 2px solid var(--acento); outline-offset: 2px; }
.pantalla .lienzo { position: relative; flex: 1; min-height: clamp(320px, 46vh, 470px); touch-action: pan-y; cursor: grab; }
.pantalla .lienzo:active { cursor: grabbing; }
.pantalla canvas { position: absolute; inset: 0; display: block; width: 100%; height: 100%; }
.rotulos { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.rot { position: absolute; left: 0; top: 0; pointer-events: auto; background: rgba(12, 15, 20, .72); border: 1px solid var(--p-linea); color: var(--p-tinta-2); border-radius: 999px; padding: 2px 9px; font-size: 11.5px; white-space: nowrap; max-width: 190px; overflow: hidden; text-overflow: ellipsis; }
.rot:hover, .rot.sel { color: var(--p-tinta); border-color: var(--p-meta); }
.rot.menor:not(.sel) { opacity: 0; pointer-events: none; }
.rot.fijo { background: none; border: 0; font-family: var(--f-dato); font-size: 10px; color: var(--p-tinta-3); pointer-events: none; padding: 0; }
.p-cab { position: absolute; left: 14px; top: 12px; right: 14px; display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; pointer-events: none; }
.p-cab .eti { color: var(--p-tinta-3); }
.p-cab strong { display: block; font-size: 15px; font-weight: 600; }
.p-cab button { pointer-events: auto; background: rgba(12, 15, 20, .7); border: 1px solid var(--p-linea); color: var(--p-tinta-2); border-radius: 999px; padding: 4px 11px; font-size: 12px; }
.p-cab button:hover { color: var(--p-tinta); border-color: var(--p-meta); }
.p-ley { position: absolute; left: 14px; display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 11px; color: var(--p-tinta-3); pointer-events: none; }
.p-ley span { display: flex; align-items: center; gap: 6px; }
.p-ley i { width: 16px; border-top: 2px solid var(--p-tinta); }
.p-ley i.plan { border-color: var(--p-plan); } .p-ley i.punt { border-top-style: dashed; border-color: var(--p-tinta-3); }
.p-ley i.pt { width: 8px; height: 8px; border: 0; border-radius: 50%; background: var(--p-tinta-3); }
.p-ley i.pt.sen { background: var(--p-aviso); } .p-ley i.pt.dec { background: var(--p-tinta); border-radius: 0; transform: rotate(45deg); }
.lienzo-caja { position: relative; flex: 1; display: flex; }
.lienzo-caja .p-ley { bottom: 10px; }
.anun { border-top: 1px solid var(--p-linea); padding: 10px 14px 12px; display: grid; gap: 10px; grid-template-columns: minmax(0, 1fr); background: rgba(12, 15, 20, .45); }
@media (min-width: 760px) { .anun { grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); } }
.anun .eti { color: var(--p-tinta-3); display: block; margin-bottom: 6px; }
.anun .luces { display: flex; flex-wrap: wrap; gap: 6px; }
.lz { display: inline-flex; align-items: center; gap: 7px; max-width: 100%; background: rgba(255, 255, 255, .04); border: 1px solid var(--p-linea); color: var(--p-tinta-2); border-radius: 8px; padding: 5px 10px; font-size: 12px; text-align: left; }
.lz span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lz i { width: 9px; height: 9px; flex: none; border-radius: 50%; border: 1.5px solid var(--p-tinta-3); }
.lz.ok i { background: var(--p-ok); border-color: var(--p-ok); box-shadow: 0 0 8px var(--p-ok); }
.lz.aviso i { background: var(--p-aviso); border-color: var(--p-aviso); border-radius: 0; clip-path: polygon(50% 0, 100% 100%, 0 100%); }
.lz.critico i { background: var(--p-critico); border-color: var(--p-critico); border-radius: 2px; box-shadow: 0 0 8px var(--p-critico); }
.lz.aviso { border-color: var(--p-aviso); color: var(--p-tinta); } .lz.critico { border-color: var(--p-critico); color: var(--p-tinta); }
.lz b { font-family: var(--f-dato); font-weight: 500; font-size: 10.5px; color: var(--p-aviso); flex: none; }
.lz.clave { font-weight: 600; color: var(--p-tinta); }
.lz:hover, .lz[aria-pressed="true"] { border-color: var(--p-meta); color: var(--p-tinta); }
.sin3d { padding: 60px 20px; text-align: center; color: var(--p-tinta-3); font-size: 13px; }
.simbar { border-top: 1px solid var(--p-linea); padding: 10px 14px; display: grid; gap: 8px; background: rgba(12, 15, 20, .6); }
.simbar .fila { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.simbar button.jugar { background: var(--p-tinta); color: var(--p-fondo); border: 0; border-radius: 999px; padding: 7px 16px; font-size: 13.5px; font-weight: 600; display: inline-flex; gap: 8px; align-items: center; }
.simbar button.jugar svg { width: 11px; height: 11px; fill: currentColor; }
.simbar button.salir { background: none; border: 0; color: var(--p-tinta-3); font-size: 12.5px; text-decoration: underline; }
.simbar .txt { font-size: 13px; color: var(--p-tinta-2); flex: 1; min-width: 200px; }
.semanas { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 3px; flex: 1; min-width: 240px; }
.sem { border: 0; background: transparent; color: var(--p-tinta-3); font-family: var(--f-dato); font-size: 11px; padding: 3px 0 8px; border-radius: 6px; position: relative; }
.sem::after { content: ""; position: absolute; left: 2px; right: 2px; bottom: 2px; height: 3px; border-radius: 2px; background: var(--p-linea); }
.sem[data-s="verde"]::after { background: var(--p-ok); } .sem[data-s="ambar"]::after { background: var(--p-aviso); } .sem[data-s="rojo"]::after { background: var(--p-critico); }
.sem:hover { color: var(--p-tinta); } .sem[aria-pressed="true"] { background: var(--p-tinta); color: var(--p-fondo); }
.sem.ev::before { content: ""; position: absolute; top: -1px; left: 50%; width: 4px; height: 4px; margin-left: -2px; border-radius: 50%; background: var(--p-aviso); }

/* ---------- consola lateral */
.consola { display: grid; gap: 14px; align-content: start; min-width: 0; }
.caja { background: var(--panel); border: 1px solid var(--linea); border-radius: var(--radio); padding: 16px; min-width: 0; }
.caja.enfoque { outline: 2px solid var(--acento); outline-offset: 2px; }
.caja > header { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 10px; }
.caja h3 { font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--tinta-2); display: flex; align-items: center; gap: 8px; }
.caja h3 .ico { color: var(--acento); }
.enlace { background: none; border: 0; color: var(--acento); font-size: 12.5px; padding: 0; }
.sello { display: flex; align-items: center; gap: 12px; }
.sello .lamp { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; background: var(--panel-2); color: var(--tinta-3); flex: none; }
.sello.go .lamp { background: var(--ok-f); color: var(--ok); } .sello.espera .lamp { background: var(--aviso-f); color: var(--aviso); } .sello.no .lamp { background: var(--critico-f); color: var(--critico); }
.sello .lamp .ico { width: 22px; height: 22px; stroke-width: 2.2; }
.sello strong { font-size: 24px; font-weight: 700; letter-spacing: .02em; line-height: 1.05; display: block; }
.puestos { display: grid; gap: 0; margin-top: 12px; }
.puesto { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 10px; padding: 8px 0; border-top: 1px solid var(--linea); font-size: 13.5px; }
.dl { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 12px; font-size: 13.5px; margin-top: 12px; }
.dl dt { color: var(--tinta-3); font-size: 12.5px; }
.medidor { display: flex; align-items: center; gap: 14px; }
.medidor svg { width: 92px; height: 92px; flex: none; }
.medidor .n { font-size: 26px; font-weight: 700; line-height: 1; }
.kpis { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin-top: 12px; }
.kpi b { display: block; font-size: 19px; font-weight: 700; line-height: 1.1; } .kpi span { font-size: 11.5px; color: var(--tinta-2); display: block; }
.evento { border-left: 3px solid var(--linea-2); padding-left: 12px; margin-top: 12px; }
.evento.senal { border-color: var(--aviso); } .evento.alerta { border-color: var(--critico); } .evento.decision { border-color: var(--tinta); } .evento.logro { border-color: var(--ok); }
.evento b { display: block; font-weight: 600; } .evento p { font-size: 13.5px; color: var(--tinta-2); margin-top: 2px; }
.ficha p { font-size: 14px; } .ficha p + p, .ficha .pista { margin-top: 8px; }

/* ---------- módulos */
.seccion { margin-top: 26px; }
.seccion > header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 14px; margin-bottom: 12px; }
.seccion > header h2 { font-size: 18px; font-weight: 600; letter-spacing: -.005em; }
.seccion > header p { font-size: 13.5px; color: var(--tinta-2); }
.modulos { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(288px, 1fr)); }
@media (min-width: 1000px) { .modulos { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
.modulos.chicos { grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); }
@media (min-width: 1000px) { .modulos.chicos { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
.mod { background: var(--panel); border: 1px solid var(--linea); border-radius: var(--radio); padding: 14px 16px 12px; text-align: left; display: grid; gap: 10px; grid-template-rows: auto 1fr auto; min-width: 0; position: relative; }
.mod:hover { border-color: var(--linea-2); }
.mod.enfoque { outline: 2px solid var(--acento); outline-offset: 2px; }
.mod > header { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.mod h3 { font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--tinta-2); display: flex; align-items: center; gap: 8px; }
.mod h3 .ico { color: var(--acento); }
.mod .cuerpo { display: grid; gap: 10px; align-content: start; min-width: 0; }
.mod .clave { font-size: 16px; font-weight: 500; line-height: 1.35; }
.mod .pie { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 12px; color: var(--tinta-3); border-top: 1px solid var(--linea); padding-top: 8px; }
.mod .pie span:last-child { color: var(--acento); font-weight: 500; display: inline-flex; align-items: center; gap: 4px; }
.mod .pie .ico { width: 13px; height: 13px; }
.mod .abrir { position: absolute; inset: 0; border: 0; background: transparent; border-radius: var(--radio); }
.mod.luego { border-style: dashed; background: transparent; }
.lista-c { list-style: none; padding: 0; display: grid; gap: 6px; font-size: 13.5px; }
.lista-c li { display: grid; grid-template-columns: 16px minmax(0, 1fr); gap: 7px; align-items: start; }
.lista-c .ico { width: 15px; height: 15px; margin-top: 3px; }
.lista-c .si { color: var(--ok); } .lista-c .no { color: var(--critico); } .lista-c .neutro { color: var(--tinta-3); } .lista-c .av { color: var(--aviso); }
.lista-c .eti { display: block; }
.dos { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.grande { font-size: 22px; font-weight: 700; line-height: 1.1; letter-spacing: -.01em; }
.pista { display: grid; gap: 4px; }
.pista .nom { font-size: 13px; line-height: 1.35; }
.riel { position: relative; height: 18px; }
.riel::before { content: ""; position: absolute; left: 0; right: 0; top: 8px; height: 2px; background: var(--linea-2); border-radius: 1px; }
.riel .banda { position: absolute; top: 5px; height: 8px; min-width: 6px; border-radius: 4px; background: var(--ok-f); border: 1px solid var(--ok); }
.riel .pt { position: absolute; top: 4px; width: 10px; height: 10px; margin-left: -5px; border-radius: 50%; background: var(--panel); border: 2px solid var(--tinta-3); }
.riel .pt.ahora { background: var(--tinta); border-color: var(--tinta); width: 12px; height: 12px; top: 3px; margin-left: -6px; box-shadow: 0 0 0 3px var(--panel); }
.pista .vals { display: flex; justify-content: space-between; font-size: 12px; color: var(--tinta-2); gap: 8px; }
.pista .vals b { color: var(--tinta); font-weight: 600; }
.seg { display: flex; gap: 2px; height: 8px; border-radius: 4px; overflow: hidden; margin-top: 4px; }
.seg i { display: block; min-width: 5px; }
.barra { height: 8px; border-radius: 4px; background: var(--panel-2); overflow: hidden; }
.barra i { display: block; height: 100%; border-radius: 4px; background: var(--tinta-2); }
.barra i.aviso { background: var(--aviso); } .barra i.ok { background: var(--ok); }
.puntos { display: flex; gap: 5px; flex-wrap: wrap; }
.puntos i { width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--tinta-3); }
.puntos i.ok { background: var(--ok); border-color: var(--ok); } .puntos i.tarde { background: var(--aviso); border-color: var(--aviso); border-radius: 2px; }
.anillo { display: flex; align-items: center; gap: 12px; }
.anillo svg { width: 58px; height: 58px; flex: none; }

  if (id === "apuesta") return { tipo: "La apuesta · supuesto clave", html: `<p style="font-weight:500">${t(d.supuesto_clave.supuesto)}</p>${s ? `<p>${est(CLS[s.clave], s.clave)}</p>` : ""}${p("Prueba:", t(d.supuesto_clave.prueba))}${p("Si resulta falso:", t(d.supuesto_clave.si_es_falso))}`, mod: "supuestos" };
  if (id === "examen") return { tipo: "Punto de control", html: `${p("Qué se revisa:", t(d.exito.examen_intermedio))}${s ? p("Semana " + s.w + ":", `${s.examen}% de avisos entregados, contra ${SIM.examen.meta}% de meta.`) : ""}`, mod: "exito" };
  if (id === "revision") return { tipo: "Punto de control", html: p("Siguiente revisión:", t(d.decision.siguiente_revision)), mod: "decision" };
  if (id === "ruta") return { tipo: "Cómo se lee la pantalla", html: `${p("De izquierda a derecha:", "el tiempo, de hoy a la meta.")}${p("Altura:", "el avance. Empieza en 0 y llega a 100% en la meta. Cada hito terminado suma la parte del proyecto que representa.")}` +
    (s ? `${p("Línea magenta:", "lo que el plan decía para esa semana.")}${p("Línea de color:", "lo que de verdad se avanzó. Si va debajo de la magenta, hay atraso.")}${p("Deriva hacia el frente:", "se gastó más de lo que vale el trabajo terminado.")}${p("Puntos y rombos:", "señales y decisiones, en la semana en que ocurrieron.")}${p("Semana " + s.w + ":", `avance ${s.real}% contra ${s.plan}% planeado; gastado $${s.gReal} mil contra $${s.gPlan} mil planeados.`)}`
       : `${p("Línea punteada:", "la ruta todavía no existe. El plan, con sus hitos y fechas, llega en el módulo 2.")}${p("Aros sobre la ruta:", "los puntos de control que el acta ya fija.")}${p("Luces de abajo:", "los supuestos y riesgos del acta. No están sobre la ruta porque todavía no tienen fecha; se encienden cuando algo cambia.")}`) };
  let m;
  if ((m = /^sup-(\d+)$/.exec(id))) { const x = d.supuestos[+m[1]]; return { tipo: "Supuesto", html: `<p style="font-weight:500">${t(x.supuesto)}</p>${s ? `<p>${est(CLS[s.sup(+m[1])], s.sup(+m[1]))}</p>` : ""}${p("Responsable:", t(x.dueno))}`, mod: "supuestos" }; }
  if ((m = /^riesgo-(\d+)$/.exec(id))) return { tipo: "Riesgo", html: `<p style="font-weight:500">${t(d.premortem[+m[1]])}</p>${s ? `<p>${est(CLS[s.riesgo(+m[1])], s.riesgo(+m[1]))}</p>` : '<p class="sub">Del pre-mortem del equipo.</p>'}`, mod: "riesgos" };
  if ((m = /^hito-(\d+)$/.exec(id))) { const x = SIM.hitos[+m[1]]; return { tipo: "Hito del plan", html: `<p style="font-weight:500">${h(x.hito)}</p>${p("Plan:", "semana " + x.plan)}${p(x.real <= (s ? s.w : 0) ? "Terminado:" : "Pronóstico:", "semana " + x.real)}`, mod: "hitos" }; }
  if ((m = /^evento-(\d+)$/.exec(id))) { const e = SIM.eventos[+m[1]]; return { tipo: TIPO_EV[e.tipo] + " · semana " + e.w, html: `<p style="font-weight:500">${h(e.titulo)}</p><p>${h(e.texto)}</p>` }; }
  return null;
}
function elegirObjeto(id) { const f = fichaDe(id, actual); if (!f) return; sel = { id, tipo: f.tipo, mod: f.mod, html: f.html + (f.mod ? `<p><button type="button" class="enlace" data-abrir="${f.mod}" style="font-size:13px">Ver el módulo completo</button></p>` : "") }; Escena.elegir(id); $("#consola").innerHTML = consola(actual); $("#anun").innerHTML = luces(actual); }

/* ------------------------------------------------------------ vistas */
let vista = "como-funciona", actual = null, guia = -1, pasoSkill = 0;
const guardado = { leer() { try { return localStorage.getItem("pos-bloque") || ""; } catch (_) { return ""; } }, poner(v) { try { v ? localStorage.setItem("pos-bloque", v) : localStorage.removeItem("pos-bloque"); } catch (_) { /* la página funciona igual sin almacenamiento */ } } };
let bloqueEquipo = guardado.leer(), errorEquipo = "";
const CAPAS = [["Acta", "Módulo 1", "Por qué existe el proyecto y qué es éxito", "firma"], ["Plan", "Módulo 2", "Qué se entrega, cuándo y quién", "hitos"], ["Pulso", "Módulo 3", "Qué pasó esta semana", "evidencia"], ["Torre", "Módulo 4", "Qué se desvía y quién decide", "proposito"]];
const rail = n => `<div class="rail">${CAPAS.map(([a, m, x, ic], i) => `<div class="${i < n ? "viva" : ""}"><span class="eti">Capa ${i + 1} · ${m}</span><b>${ico(ic)}${a}</b><span>${x}</span></div>`).join("")}</div>`;
function simbar() {
  if (!sim.on) return `<div class="fila"><button type="button" class="jugar" id="sim-on"><svg viewBox="0 0 12 12"><path d="M2 1v10l9-5z"/></svg>Ver lo que viene: simular 12 semanas</button><span class="txt">Hoy tienes la capa 1: el acta. Esto muestra lo que agregan el plan, el pulso y la torre.</span></div>`;
  const ev = SIM.eventos.filter(e => e.w === sim.w)[0];
  return `<div class="fila"><button type="button" class="jugar" id="sim-jugar">${sim.reloj ? '<svg viewBox="0 0 12 12"><path d="M2 1h3v10H2zM7 1h3v10H7z"/></svg>Pausa' : '<svg viewBox="0 0 12 12"><path d="M2 1v10l9-5z"/></svg>Reproducir'}</button>
    <div class="semanas" role="group" aria-label="Semana">${Array.from({ length: SIM.semanas + 1 }, (_, w) => `<button type="button" class="sem ${SIM.eventos.some(e => e.w === w) ? "ev" : ""}" data-w="${w}" data-s="${SIM.salud[w]}" aria-pressed="${w === sim.w}" aria-label="Semana ${w}">${w}</button>`).join("")}</div>
    <button type="button" class="salir" id="sim-off">Volver al acta</button></div><div class="txt"><b style="color:var(--p-tinta)">Semana ${sim.w}.</b> ${ev ? h(ev.titulo) + "." : "Sin novedades."} <span style="color:var(--p-tinta-3)">Datos simulados.</span></div>`;
}
function luces(d) {   /* una luz por supuesto y por riesgo: apagada mientras no pasa nada, ámbar o roja cuando hay que mirar */
  const s = S(), n = id => s ? s.eventos.filter(e => e.a === id && (e.tipo === "senal" || e.tipo === "alerta")).length : 0;
  const lz = (id, txt, estado, clave) => `<button type="button" class="lz ${CLS[estado] === "hueco" ? "" : CLS[estado]} ${clave ? "clave" : ""}" data-ficha="${id}" aria-pressed="${!!sel && sel.id === id}" title="${h(txt)} · ${estado}"><i></i><span>${h(recorta(txt, clave ? 46 : 30))}</span>${n(id) ? `<b>${n(id)} ${n(id) === 1 ? "señal" : "señales"}</b>` : ""}</button>`;
  const sup = (vacio(d.supuesto_clave.supuesto) ? "" : lz("apuesta", d.supuesto_clave.supuesto, s ? s.clave : "sin probar", true)) + d.supuestos.map((x, i) => lz("sup-" + i, x.supuesto, s ? s.sup(i) : "sin probar")).join("");
  const rie = d.premortem.map((x, i) => lz("riesgo-" + i, x, s ? s.riesgo(i) : "vigilado")).join("");
  return `<div><span class="eti">Supuestos · lo que tiene que ser cierto</span><div class="luces">${sup || '<span class="sub">Sin supuestos en el acta.</span>'}</div></div><div><span class="eti">Riesgos · lo que se vigila</span><div class="luces">${rie || '<span class="sub">Sin riesgos en el acta.</span>'}</div></div>`;
}
const leyenda = () => sim.on ? `<span><i class="plan"></i>Plan</span><span><i></i>Ruta real</span><span><i class="pt sen"></i>Señal</span><span><i class="pt dec"></i>Decisión</span>` : `<span><i class="punt"></i>Ruta por definir: el plan llega en el módulo 2</span>`;
const pcab = () => `<div><span class="eti">${sim.on ? "Plan · pulso · torre (simulación)" : "Capa 1 · la ruta según el acta"}</span><strong>${sim.on ? "De hoy a la meta, semana a semana" : "De hoy a la meta"}</strong></div><button type="button" data-ficha="ruta">¿Cómo se lee?</button>`;
function pagina(d, esEjemplo, extra = "") {
  const s = S();
  return `<div class="ancho"><header class="cab"><div><p class="eti">${[d.organizacion, d.equipo, d.fecha, "Acta de constitución del proyecto"].filter(x => !vacio(x)).map(h).join(" · ")}</p><h1>${t(d.iniciativa || d.proyecto.nombre)}</h1></div>
      <div class="hechos">${esEjemplo ? '<button type="button" class="chip" id="ir-guia"><b>Recorrido guiado</b></button>' : ""}<span class="chip">Sponsor <b>${vacio(d.acta.decide) ? "sin definir" : h(recorta(d.acta.decide, 34))}</b></span></div></header>
    <div class="principal"><section class="pantalla" aria-label="Ruta del proyecto">
        <div class="lienzo-caja"><div class="lienzo" id="lienzo"></div><div class="p-cab" id="pcab">${pcab()}</div><div class="p-ley" id="leyenda">${leyenda()}</div></div>
        <div class="anun" id="anun">${luces(d)}</div>
        ${esEjemplo ? `<div class="simbar" id="simbar">${simbar()}</div>` : ""}</section>
      <aside class="consola" id="consola">${consola(d)}</aside></div>
    ${extra}
    <section class="seccion"><header><h2>Acta de constitución</h2><p>Lo que el proyecto promete, hasta dónde llega y quién lo autoriza.</p></header><div class="modulos" id="modulos">${MOD.map(m => tarjeta(m, d, s)).join("")}</div></section>
    <section class="seccion"><header><h2>Cómo llegamos aquí</h2><p>El caso de negocio que sostiene el acta.</p></header><div class="modulos chicos" id="proceso">${PRO.map(m => tarjeta(m, d, s)).join("")}</div></section>
    <section class="seccion">${rail(sim.on ? 4 : 1)}</section>
    <p class="pie-pag">Esta página muestra lo que el equipo escribió en su Framing Brief. No completa ni inventa nada: lo que falta se ve como «falta definir».${esEjemplo ? " Aseguradora Faro es un caso ficticio." : ""}</p></div>`;
}
const SKILL = [["Punto de partida", "Pegas lo que tengas: tu Framing Brief v1, el v0 o solo la solicitud. Si todavía no hay caso de negocio, la skill arma uno corto con opciones, incluida «seguir como estamos», y tu equipo elige."], ["Riesgos", "Es dentro de un año y el proyecto fracasó: ¿por qué? Tu equipo escribe sus razones, la IA suma hasta seis más y eligen las tres más probables. Esos son los riesgos del acta."], ["Objetivos y criterios de éxito", "Seis campos: beneficio y efecto negativo; indicador, instrumento, línea base y meta; punto de control, guardrail y los tres responsables."], ["El acta", "Sponsor y stakeholders; alcance, con lo que incluye y al menos tres cosas que no incluye; restricciones y presupuesto; y la autoridad de la IA: puede, pregunta antes, nunca."], ["Entrega", "Ya no pregunta. Entrega tu Framing Brief v2, la lista de huecos y el bloque POS, que pegas en «Mi equipo»."], ["La decisión", "Go, investigar, todavía no o no-go: qué autoriza, con qué presupuesto límite, quién sigue y cuándo se revisa. Después te da otra vez el bloque POS, ya con la decisión."]];
function comoFunciona() {
  return `<div class="ancho"><div class="texto"><p class="eti">Project Operating System</p><h1>Una sala de control para tu proyecto, que empieza por el acta</h1>
      <p>El POS reúne lo que tu equipo sabe, decidió y vigila. Crece una capa por módulo. Hoy construyes la primera: el acta de constitución, que es lo que después usan tu plan, tus reportes y tus agentes de IA para saber qué importa.</p>
      <div class="botones"><a class="btn primario" href="#ejemplo">Ver el ejemplo</a><a class="btn" href="#mi-equipo">Cargar el acta de mi equipo</a></div></div>
    <section class="seccion">${rail(1)}</section>
    <section class="seccion"><header><h2>Qué hace la skill en modo charter</h2><p>Toca cada ronda.</p></header>
      <div class="flujo"><div class="caja"><header><h3>Recibe</h3></header><ul class="lista-c"><li>${ico("evidencia", "neutro")}Lo que tengas: tu Framing Brief v1, el v0 o solo la solicitud</li><li>${ico("interesados", "neutro")}El nombre de tu equipo</li><li>${ico("problema", "neutro")}Tus respuestas, un tema a la vez</li></ul></div>
        <div class="caja"><header><h3>Pregunta, en cinco rondas</h3></header><div class="pasos" id="pasos-skill">${SKILL.map((p, i) => `<button type="button" data-paso="${i}" aria-pressed="${i === pasoSkill}"><b>${i}</b>${p[0]}</button>`).join("")}</div><p style="margin-top:12px" id="paso-texto">${SKILL[pasoSkill][1]}</p>
          <p class="sub" style="margin-top:10px">No planea, no inventa y no decide por ti. Si falta un dato escribe «por confirmar».</p></div>
        <div class="caja"><header><h3>Entrega</h3></header><ul class="lista-c"><li>${ico("firma", "si")}Tu Framing Brief v2: el acta</li><li>${ico("problema", "si")}La lista de huecos, del más grave al menos grave</li><li>${ico("alcance", "si")}El bloque POS, que pegas en «Mi equipo»</li></ul></div></div></section>
    <p class="pie-pag">¿Quieres saber cómo se escribió la skill? El prompt con el que se creó está en los recursos de la sesión.</p></div>`;
}
function miEquipo() {
  if (actual) return pagina(actual, false, `<div class="barra-equipo"><span>Esta es el acta de tu equipo. Se guarda solo en este navegador.</span><span class="botones"><button type="button" class="btn" id="cambiar">Pegar otro bloque</button><button type="button" class="btn" id="borrar">Borrar</button></span></div>`);
  return `<div class="ancho"><div class="texto"><p class="eti">Mi equipo</p><h1>Pega aquí tu bloque POS</h1><p>En ChatGPT, modo Work, escribe <b>@framing-brief, modo charter</b> y pega lo que tengas: tu Framing Brief v1, el v0 o solo la solicitud, con el nombre de tu equipo. En la ronda 4 te entrega el bloque POS. Cópialo completo y pégalo aquí.</p></div>
    <div class="pegar"><textarea id="bloque" spellcheck="false" aria-label="Bloque POS" placeholder='{ "pos": "1", "iniciativa": "…" }'>${h(bloqueEquipo)}</textarea>
    ${errorEquipo ? `<p class="error" role="alert">${h(errorEquipo)}</p>` : ""}
    <div class="botones"><button type="button" class="btn primario" id="mostrar">Mostrar mi acta</button><a class="btn" href="#ejemplo">Ver primero el ejemplo</a></div>
    <p class="sub">Lo que pegas se queda en este navegador. No se envía a ningún lado.</p></div></div>`;
}
function pintar() {
  document.querySelectorAll("#pestanas a").forEach(a => a.dataset.vista === vista ? a.setAttribute("aria-current", "page") : a.removeAttribute("aria-current"));
  cerrar(); sel = null; if (vista !== "ejemplo") pararSim(true);
  if (vista === "ejemplo") actual = normalizar(EJEMPLO); else if (vista === "mi-equipo") { const r = bloqueEquipo ? leerBloque(bloqueEquipo) : {}; actual = r.datos || null; } else actual = null;
  $("#vista").innerHTML = vista === "ejemplo" ? pagina(actual, true) : vista === "mi-equipo" ? miEquipo() : comoFunciona();
  if (actual && $("#lienzo")) { Escena.montar($("#lienzo"), actual, vista === "ejemplo", elegirObjeto); Escena.simular(sim.on); Escena.semana(sim.w); } else Escena.quitar();
  if (guia >= 0 && vista !== "ejemplo") cerrarGuia();
}
function refrescar() {   /* cambia la semana o el modo: se repintan consola, módulos y barra; la escena solo se mueve */
  const s = S(); $("#consola").innerHTML = consola(actual); $("#modulos").innerHTML = MOD.map(m => tarjeta(m, actual, s)).join(""); if ($("#simbar")) $("#simbar").innerHTML = simbar(); $("#leyenda").innerHTML = leyenda(); $("#pcab").innerHTML = pcab(); $("#anun").innerHTML = luces(actual);
  document.querySelectorAll(".rail div").forEach((x, i) => x.classList.toggle("viva", i < (sim.on ? 4 : 1)));
  Escena.semana(sim.w); if (abierto) abrir(abierto);
}
function pararSim(todo) { if (sim.reloj) { clearInterval(sim.reloj); sim.reloj = null; } if (todo) { sim.on = false; sim.w = 0; } }
function irSemana(w) { sim.w = Math.max(0, Math.min(SIM.semanas, w)); if (sel && /^(evento|hito)/.test(sel.id)) { sel = null; Escena.elegir(null); } else if (sel) { const f = fichaDe(sel.id, actual); if (f) sel.html = f.html + (f.mod ? `<p><button type="button" class="enlace" data-abrir="${f.mod}" style="font-size:13px">Ver el módulo completo</button></p>` : ""); } refrescar(); }
function jugar() { if (sim.w >= SIM.semanas) sim.w = 0; sim.reloj = setInterval(() => { if (sim.w >= SIM.semanas) { pararSim(false); refrescar(); return; } irSemana(sim.w + 1); }, 2600); refrescar(); }
function ir(v) { const antes = vista; vista = ["ejemplo", "mi-equipo"].includes(v) ? v : "como-funciona"; pintar(); if (antes !== vista) scrollTo(0, 0); }
addEventListener("hashchange", () => ir(location.hash.slice(1)));

/* ------------------------------------------------------------ recorrido guiado */
const PASOS = [{ id: "lienzo", t: "La ruta del proyecto", x: "De izquierda a derecha, el tiempo; hacia arriba, el avance. Debajo, una luz por cada supuesto y cada riesgo del acta: se encienden cuando algo cambia. Toca cualquiera para ver qué es." }, { id: "m-decision", t: "La decisión", x: EXTRA.decision.pmi }, { id: "m-firma", t: "Lista para firma", x: "Cuántas partes del acta están completas. Lo que falta se ve, no se esconde." },
  ...MOD.map(m => ({ id: "m-" + m.id, t: m.t, x: m.pmi + " " + m.despues })), ...PRO.map(m => ({ id: "m-" + m.id, t: m.t, x: m.pmi }))];
function pasoGuia(n) {
  guia = Math.max(0, Math.min(PASOS.length - 1, n)); const p = PASOS[guia];
  document.querySelectorAll(".enfoque").forEach(e => e.classList.remove("enfoque"));
  let el = document.getElementById(p.id); if (el) { el = el.closest(".pantalla") || el; el.classList.add("enfoque"); el.scrollIntoView({ block: "center" }); }
  $("#guia").hidden = false; $("#guia-paso").textContent = `Paso ${guia + 1} de ${PASOS.length}`; $("#guia-titulo").textContent = p.t; $("#guia-texto").textContent = p.x;
  $("#guia-ant").disabled = guia === 0; $("#guia-sig").textContent = guia === PASOS.length - 1 ? "Terminar" : "Siguiente";
}
function cerrarGuia() { guia = -1; $("#guia").hidden = true; document.querySelectorAll(".enfoque").forEach(e => e.classList.remove("enfoque")); }
$("#guia-ant").addEventListener("click", () => pasoGuia(guia - 1));
$("#guia-sig").addEventListener("click", () => guia === PASOS.length - 1 ? cerrarGuia() : pasoGuia(guia + 1));
$("#guia-cerrar").addEventListener("click", cerrarGuia);

document.addEventListener("click", e => {
  if (e.target.closest("[data-cerrar]")) return cerrar();
  const b = e.target.closest("button"); if (!b) return;
  if (b.dataset.abrir) abrir(b.dataset.abrir);
  else if (b.dataset.ficha) elegirObjeto(b.dataset.ficha);
  else if (b.dataset.filtro != null) { filtroEv = b.dataset.filtro; $("#c-evidencia").innerHTML = listaEvidencia(actual); }
  else if (b.dataset.paso != null) { pasoSkill = +b.dataset.paso; document.querySelectorAll("#pasos-skill button").forEach((x, i) => x.setAttribute("aria-pressed", i === pasoSkill)); $("#paso-texto").textContent = SKILL[pasoSkill][1]; }
  else if (b.dataset.w != null) { pararSim(false); irSemana(+b.dataset.w); }
  else if (b.id === "quitar-sel") { sel = null; Escena.elegir(null); $("#consola").innerHTML = consola(actual); $("#anun").innerHTML = luces(actual); }
  else if (b.id === "sim-on") { if (guia >= 0) cerrarGuia(); sim.on = true; sim.w = 0; sel = null; Escena.elegir(null); Escena.simular(true); jugar(); }
  else if (b.id === "sim-off") { pararSim(true); sel = null; Escena.elegir(null); Escena.simular(false); refrescar(); }
  else if (b.id === "sim-jugar") { if (sim.reloj) { pararSim(false); refrescar(); } else jugar(); }
  else if (b.id === "ir-guia") { if (sim.on) { pararSim(true); Escena.simular(false); refrescar(); } pasoGuia(0); }
  else if (b.id === "mostrar") { const txt = $("#bloque").value, r = leerBloque(txt); bloqueEquipo = txt; errorEquipo = r.error || ""; if (r.datos) guardado.poner(txt); pintar(); if (r.datos) scrollTo(0, 0); }
  else if (b.id === "cambiar") { actual = null; errorEquipo = ""; Escena.quitar(); $("#vista").innerHTML = miEquipo(); scrollTo(0, 0); }
  else if (b.id === "borrar") { bloqueEquipo = ""; errorEquipo = ""; guardado.poner(""); pintar(); }
});
ir(location.hash.slice(1));
</script>
<!--/CUERPO-->
</body>
</html>
